<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudioShare Face — Web Preview</title>
  <!-- Build first: `npm --prefix packages/web run build`, then serve the repo root
       (e.g. `npx serve .`) and open /packages/web/demo/. -->
  <style>
    :root { --bg: #121214; --card: #1a1a1e; --text: #fff; --muted: #9a9aa2; --line: #2c2c32; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    .stage { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; }
    .chip { padding: 4px 10px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; }
    .chip.active { background: var(--text); color: #000; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .cell { background: var(--card); padding: 8px; text-align: center; color: var(--muted); font-size: 12px; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>StudioShare Face</h1>
  <div class="stage">
    <canvas id="big" style="width:220px;height:220px"></canvas>
    <div>
      <div class="chips" id="chips"></div>
      <p><label>Progress <input id="progress" type="range" min="0" max="100" value="45" /></label></p>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <!-- the sources import './moments' without an extension (for bundlers); map it for the browser -->
  <script type="importmap">{ "imports": { "../dist/moments": "../dist/moments.js" } }</script>
  <script type="module">
    import { StudioFacePlayer, faceExpressions } from '../dist/face.js';

    const sized = (el, css) => {
      const dpr = window.devicePixelRatio || 1;
      el.width = css * dpr;
      el.height = css * dpr;
      el.style.width = el.style.height = css + 'px';
      return el;
    };

    const big = new StudioFacePlayer(sized(document.getElementById('big'), 220), 'idle');
    big.progress = 0.45;
    // the big face watches the pointer, like the notch companion watches the cursor
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) big.followPointer();
    document.getElementById('progress').oninput = (e) => (big.progress = e.target.value / 100);

    const moods = Object.keys(faceExpressions).sort();
    const chips = document.getElementById('chips');
    for (const m of moods) {
      const chip = document.createElement('div');
      chip.className = 'chip' + (m === 'idle' ? ' active' : '');
      chip.textContent = m;
      chip.onclick = () => {
        big.setMood(m);
        chips.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === chip));
      };
      chips.appendChild(chip);
    }

    const grid = document.getElementById('grid');
    for (const m of moods) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const c = sized(document.createElement('canvas'), 100);
      cell.append(c, m);
      grid.appendChild(cell);
      const p = new StudioFacePlayer(c, m, !matchMedia('(prefers-reduced-motion: reduce)').matches);
      p.progress = 0.45;
    }
  </script>
</body>
</html>
